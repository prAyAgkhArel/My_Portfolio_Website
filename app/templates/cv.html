{% extends "base.html" %}
{% block title %}CV — Prayag Kharel{% endblock %}
{% block page_css %}
<style>
.pdf{
    background: linear-gradient(
        135deg,
        #ffffff,
        #e9f2ff
    );

    min-height: 100vh;
    padding: 50px 20px;
}
</style>
{% endblock  %}

{% block content %}

<section class="pdf">
   <div class="container py-4">
     <p>
       <a href="{{ url_for('static', filename='mycv.pdf') }}" target="_blank" rel="noopener">
         Open CV in a new tab ↗
       </a>
     </p>
     <iframe
       src="{{ url_for('static', filename='mycv.pdf') }}"
       width="100%"
       height="900"
       title="Prayag Kharel's CV">
     </iframe>
   </div>
</section>

{% endblock %}
