{% extends "base.html" %}

{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/contact.css') }}">
{% endblock %}

{% block content %}

<section class="contact">
    <div class="container">

        <h1>Contact Me</h1>

        <p class="intro">
            Feel free to reach out for collaborations, internships,
            freelance work, or just to connect.
        </p>

        <div class="contact-info">

            <div class="contact-card">
                <h3>Email</h3>
                <p>prayagkharel006@gmail.com</p>
            </div>

            <div class="contact-card">
                <h3>GitHub</h3>
                <a href="https://github.com/prAyAgkhArel" target="_blank">
                    GitHub
                </a>
            </div>

            <div class="contact-card">
                <h3>LinkedIn</h3>
                <a href="https://www.linkedin.com/in/prayag-kharel-195a18336/" target="_blank">
                    LinkedIn
                </a>
            </div>

        </div>

        <form class="contact-form" action={{ url_for('get_contact') }} method='POST'>

            <input type="text" placeholder="Your First Name" name="first_name" required>
            <input type="text" placeholder="Your Last Name" name="last_name" required>


            <input type="email" placeholder="Your Email" name="email" required>

            <textarea
                rows="5"
                placeholder="Your Message"
                name = "message"
                required></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

    </div>
</section>

{% endblock %}
